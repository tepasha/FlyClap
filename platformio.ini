; PlatformIO — https://docs.platformio.org/page/projectconf.html
;
; Структура проєкту:
;   lib/FlyDefense/   бібліотека: основа (fly::Base) і модулі
;   src/<назва>/      прошивки — готові збірки модулів (по одній на середовище)
;   test/             тести модулів на ПК:  pio test -e native
;
; Збірка й прошивка:  pio run -e flyclap -t upload
; Монітор порту:      pio device monitor

[platformio]
default_envs = flyclap, flysonar

[env]
monitor_speed = 115200

; ---------------- Плати ----------------
[uno]
platform = atmelavr
board = uno
framework = arduino
test_ignore = *

; Arduino Nano (ATmega328P, новий бутлоадер). Для старих клонів: nanoatmega328.
[nano]
extends = uno
board = nanoatmega328new

; ESP32-CAM AI-Thinker (4 МБ PSRAM)
[esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
test_ignore = *

; ESP32-S3-EYE / Freenove ESP32-S3-WROOM CAM (8 МБ OPI PSRAM)
[esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; ---------------- FlyClap: ІЧ-завіса + хлопавка ----------------
[env:flyclap]
extends = uno
build_src_filter = +<flyclap/>

; Завіса на модульованих приймачах TSSP4038 (несуча 38 кГц на D3)
[env:flyclap_tssp]
extends = uno
build_src_filter = +<flyclap/>
build_flags = -DBEAM_SENSOR_TSSP=1

[env:flyclap_nano]
extends = nano
build_src_filter = +<flyclap/>

; ---------------- FlySonar: турель із сонаром ----------------
[env:flysonar]
extends = uno
build_src_filter = +<flysonar/>

[env:flysonar_nano]
extends = nano
build_src_filter = +<flysonar/>

; Турель на Arduino, якою керує ESP32 "очі" (env flysonar_esp32_eyes)
[env:flysonar_turret]
extends = uno
build_src_filter = +<flysonar_turret/>

[env:flysonar_turret_nano]
extends = nano
build_src_filter = +<flysonar_turret/>

; ---------------- FlySonar ESP32: турель із камерою ----------------
; Самостійна: одна плата — камера, серви, клапан. Arduino не потрібен.
[env:flysonar_esp32]
extends = esp32cam
build_src_filter = +<flysonar_esp32/>

[env:flysonar_esp32_s3]
extends = esp32s3cam
build_src_filter = +<flysonar_esp32/>

; Роль "очі": ESP32 лише бачить і шле кути на Arduino (env flysonar_turret)
[env:flysonar_esp32_eyes]
extends = esp32cam
build_src_filter = +<flysonar_eyes/>

[env:flysonar_esp32_s3_eyes]
extends = esp32s3cam
build_src_filter = +<flysonar_eyes/>

; ---------------- Шаблон своєї збірки ----------------
[env:mybuild]
extends = uno
build_src_filter = +<mybuild/>

; ---------------- Тести на ПК (потрібен g++ у PATH) ----------------
; Модулі бібліотеки на макеті Arduino API (test/mock):  pio test -e native
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
lib_ignore = Servo            ; на ПК Servo.h і EEPROM.h — з макета test/mock
build_flags = -std=gnu++11 -I test/mock -Wall -Wextra -Wno-unused-parameter
