; PlatformIO — https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware
default_envs = flyclap, flysonar

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

[env:flyclap]
build_src_filter = -<*> +<flyclap/>

; Завіса на модульованих приймачах TSSP4038 (несуча 38 кГц на D3)
[env:flyclap_tssp]
build_src_filter = -<*> +<flyclap/>
build_flags = -DBEAM_SENSOR_TSSP=1

[env:flysonar]
build_src_filter = -<*> +<flysonar/>

; Цілі від ESP32-CAM (firmware/flyvision) замість сонара
[env:flysonar_camera]
build_src_filter = -<*> +<flysonar/>
build_flags = -DTARGET_SOURCE_CAMERA=1

; Той самий код для Arduino Nano (ATmega328P, новий бутлоадер).
; Для старих клонів Nano замініть на nanoatmega328.
[env:flyclap_nano]
board = nanoatmega328new
build_src_filter = -<*> +<flyclap/>

[env:flysonar_nano]
board = nanoatmega328new
build_src_filter = -<*> +<flysonar/>

[env:flysonar_camera_nano]
board = nanoatmega328new
build_src_filter = -<*> +<flysonar/>
build_flags = -DTARGET_SOURCE_CAMERA=1

; ---------------- FlyVision (ESP32) ----------------
; ESP32-CAM AI-Thinker (4 МБ PSRAM)
[env:flyvision]
platform = espressif32
board = esp32cam
build_src_filter = -<*> +<flyvision/>
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -DCAMERA_MODEL_AI_THINKER

; ESP32-S3-EYE / Freenove ESP32-S3-WROOM CAM (8 МБ OPI PSRAM)
[env:flyvision_s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_src_filter = -<*> +<flyvision/>
build_flags = -DBOARD_HAS_PSRAM -DCAMERA_MODEL_ESP32S3_EYE -DARDUINO_USB_CDC_ON_BOOT=1
