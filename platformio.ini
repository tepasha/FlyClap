; PlatformIO — https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = firmware
default_envs = flyclap, flysonar

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

[env:flyclap]
build_src_filter = -<*> +<flyclap/>

; Завіса на модульованих приймачах TSSP4038 (несуча 38 кГц на D3)
[env:flyclap_tssp]
build_src_filter = -<*> +<flyclap/>
build_flags = -DBEAM_SENSOR_TSSP=1

[env:flysonar]
build_src_filter = -<*> +<flysonar/>

; Цілі від ESP32-CAM у ролі "очі" (env flysonar_esp32_eyes) замість сонара
[env:flysonar_camera]
build_src_filter = -<*> +<flysonar/>
build_flags = -DTARGET_SOURCE_CAMERA=1

; Той самий код для Arduino Nano (ATmega328P, новий бутлоадер).
; Для старих клонів Nano замініть на nanoatmega328.
[env:flyclap_nano]
board = nanoatmega328new
build_src_filter = -<*> +<flyclap/>

[env:flysonar_nano]
board = nanoatmega328new
build_src_filter = -<*> +<flysonar/>

[env:flysonar_camera_nano]
board = nanoatmega328new
build_src_filter = -<*> +<flysonar/>
build_flags = -DTARGET_SOURCE_CAMERA=1

; ---------------- FlySonar, ESP32-версія ----------------
; Самостійна: одна плата — камера, серви, клапан. Arduino не потрібен.
[esp32cam]
platform = espressif32
board = esp32cam
build_src_filter = -<*> +<flysonar_esp32/>
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -DCAMERA_MODEL_AI_THINKER

[esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_src_filter = -<*> +<flysonar_esp32/>
build_flags = -DBOARD_HAS_PSRAM -DCAMERA_MODEL_ESP32S3_EYE -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-CAM AI-Thinker (4 МБ PSRAM)
[env:flysonar_esp32]
extends = esp32cam

; ESP32-S3-EYE / Freenove ESP32-S3-WROOM CAM (8 МБ OPI PSRAM)
[env:flysonar_esp32_s3]
extends = esp32s3cam

; Роль "очі": ESP32 лише бачить і шле кути на Arduino (env flysonar_camera)
[env:flysonar_esp32_eyes]
extends = esp32cam
build_flags = ${esp32cam.build_flags} -DESP32_ROLE_EYES=1

[env:flysonar_esp32_s3_eyes]
extends = esp32s3cam
build_flags = ${esp32s3cam.build_flags} -DESP32_ROLE_EYES=1
