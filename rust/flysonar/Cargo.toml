[package]
name = "flysonar"
version = "0.1.0"
edition = "2021"
description = "FlySonar — турель з водометом для мух (Arduino Uno / Nano)"
license = "MIT"
publish = false

# Окремий крейт зі своїм тулчейном (nightly + avr-none), не член хост-воркспейсу
[workspace]

[[bin]]
name = "flysonar"
test = false
bench = false

[features]
default = ["uno"]
uno = ["arduino-hal/arduino-uno"]
nano = ["arduino-hal/arduino-nano"]
# Цілі від ESP32-CAM у ролі "очі" (flysonar-esp32 з feature `eyes`) замість сонара
camera = []
# Клапан 12 В + бак під тиском замість помпи R385
valve = []
# Сонар: стріляти й по цілі в польоті (за замовчуванням — лише по нерухомій)
moving-targets = []

[dependencies]
flycore = { path = "../flycore", features = ["ufmt"] }
ufmt = "0.2"
avr-device = "0.8.1"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e0b0105b11a7c4209fb1704276a7921c3139d5cb"

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
